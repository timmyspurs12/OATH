<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OATH — Every claim faces a jury.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,560;9..144,680&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --ink:#131009; --ink-2:#1C1712; --ink-3:#262017; --line:#2E2619;
  --paper:#F2EBDD; --paper-dim:#A89C82;
  --seal-red:#B3442E; --verdict-green:#3E8A62; --verdict-amber:#C08A2E; --verdict-blue:#4E7CA8;
  --gold:#D9A83C;
  --serif:'Fraunces', Georgia, serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --sans:'Inter', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--sans);}
body{position:relative;min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold);color:var(--ink);}

/* paper grain overlay */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.045;mix-blend-mode:overlay;
}

/* ===================== LAYOUT ===================== */
#app{display:flex;min-height:100vh;}
#rail{
  width:280px;flex:0 0 280px;border-right:1px solid var(--line);background:var(--ink-2);
  padding:22px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;
}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#content{flex:1;padding:34px 40px 60px;max-width:1240px;width:100%;margin:0 auto;}

.brand{display:flex;flex-direction:column;gap:2px;}
.brand-mark{font-family:var(--serif);font-size:26px;font-weight:680;letter-spacing:.5px;}
.brand-mark span{color:var(--seal-red);}
.brand-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper-dim);}

.navlist{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.navitem{
  font-family:var(--mono);font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--paper-dim);text-decoration:none;padding:9px 10px;border-radius:3px;border:1px solid transparent;
  display:flex;align-items:center;gap:9px;transition:background .15s,color .15s,border-color .15s;
}
.navitem:hover{color:var(--paper);background:var(--ink-3);}
.navitem.active{color:var(--gold);border-color:var(--line);background:var(--ink-3);}
.navitem .dot{width:5px;height:5px;border-radius:1px;background:currentColor;flex:0 0 auto;}

.rail-stats{border-top:1px double var(--line);padding-top:16px;display:flex;flex-direction:column;gap:11px;}
.rail-stat-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.4px;}
.rail-stat-row .k{color:var(--paper-dim);text-transform:uppercase;}
.rail-stat-row .v{color:var(--paper);}

.rail-seal{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);}
.rail-seal-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:8px;}

#topbar{display:none;}

@media (max-width:900px){
  #rail{display:none;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);background:var(--ink-2);position:sticky;top:0;z-index:50;
  }
  #topbar .brand-mark{font-size:19px;}
  #topbar select{background:var(--ink-3);color:var(--paper);border:1px solid var(--line);font-family:var(--mono);
    font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:7px 8px;border-radius:3px;}
  #content{padding:22px 16px 50px;}
}

/* ===================== WIRE TICKER ===================== */
.ticker-wrap{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--ink-2);
  overflow:hidden;white-space:nowrap;position:relative;
}
.ticker-track{display:inline-flex;gap:40px;padding:9px 0;animation:ticker 42s linear infinite;}
.ticker-wrap:hover .ticker-track{animation-play-state:paused;}
.ticker-item{font-family:var(--mono);font-size:11px;letter-spacing:.6px;color:var(--paper-dim);display:inline-flex;gap:8px;align-items:center;}
.ticker-item b{color:var(--paper);font-weight:500;}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;}}

/* ===================== DEMO BADGE ===================== */
.demo-badge{
  position:fixed;top:16px;right:18px;z-index:200;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--paper-dim);background:var(--ink-2);border:1px solid var(--line);
  padding:6px 10px;border-radius:3px;display:flex;align-items:center;gap:7px;
}
.demo-badge .pip{width:6px;height:6px;border-radius:50%;background:var(--paper-dim);}
@media (max-width:900px){.demo-badge{position:static;margin-left:auto;}}

/* ===================== FOLDER CARD ===================== */
.folder{
  background:var(--ink-2);border:1px solid var(--line);border-radius:8px;position:relative;padding:26px 24px 22px;
  margin-top:22px;
}
.folder-tab{
  position:absolute;top:-15px;left:22px;background:var(--ink-3);border:1px solid var(--line);border-bottom:none;
  border-radius:5px 5px 0 0;padding:5px 12px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--gold);
}

/* ===================== HERO / S1 ===================== */
.hero-grid{display:grid;grid-template-columns:58fr 42fr;gap:34px;align-items:start;}
@media (max-width:1050px){.hero-grid{grid-template-columns:1fr;}}

h1.hero-headline{
  font-family:var(--serif);font-weight:560;font-size:clamp(32px,4.6vw,52px);line-height:1.05;margin:6px 0 12px;
  letter-spacing:-0.5px;
}
.hero-sub{font-size:14.5px;line-height:1.6;color:var(--paper-dim);max-width:52ch;margin:0 0 22px;}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--seal-red);}

.filing-steps{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim);
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.filing-steps span:not(:last-child)::after{content:'·';margin-left:6px;color:var(--line);}

label.field-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--paper-dim);margin:16px 0 6px;}
.field-label b{color:var(--gold);}
input.field, textarea.field{
  width:100%;background:var(--ink-3);border:1px solid var(--line);border-radius:5px;color:var(--paper);
  padding:11px 12px;font-size:13.5px;outline:none;transition:border-color .15s;
}
input.field{font-family:var(--mono);}
textarea.field{font-family:var(--serif);font-size:15px;line-height:1.5;min-height:78px;resize:vertical;}
input.field:focus, textarea.field:focus{border-color:var(--gold);}
input.field::placeholder, textarea.field::placeholder{color:#5d5644;}

.exhibit-rows{display:flex;flex-direction:column;gap:7px;}
.exhibit-row{display:flex;align-items:center;gap:8px;}
.exhibit-row .ex-label{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:1px;width:64px;flex:0 0 auto;}
.ghost-btn{
  background:transparent;border:1px dashed var(--line);color:var(--paper-dim);font-family:var(--mono);
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border-radius:5px;margin-top:8px;
  transition:border-color .15s,color .15s;
}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.type-chip{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--ink-3);color:var(--paper-dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;padding:8px 11px;
  border-radius:5px;transition:all .15s;
}
.type-chip svg{width:13px;height:13px;stroke:currentColor;fill:none;}
.type-chip:hover{color:var(--paper);}
.type-chip.selected{border-color:var(--gold);color:var(--gold);background:rgba(217,168,60,.08);}

.submit-btn{
  margin-top:20px;background:var(--paper);color:var(--ink);border:none;border-radius:5px;padding:13px 22px;
  font-family:var(--mono);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;
  transition:background .15s;
}
.submit-btn:hover{background:var(--gold);}
.stake-line{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);letter-spacing:.5px;margin-top:10px;}

.demo-banner{
  border:1px solid var(--line);background:var(--ink-3);border-left:3px solid var(--gold);border-radius:0 5px 5px 0;
  padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--paper-dim);line-height:1.6;margin-bottom:18px;
}
.demo-banner a{color:var(--gold);text-decoration:underline;}

/* caseboard */
.board-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);position:relative;}
.board-item:last-child{border-bottom:none;}
.thumb{width:6px;height:6px;border-radius:50%;background:var(--seal-red);margin-top:5px;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(179,68,46,.18);}
.board-item-title{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:5px;}
.board-item-body{font-size:12.5px;color:var(--paper);}
.exchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;border:1px solid var(--line);
  border-radius:4px;padding:3px 7px;margin:3px 5px 0 0;color:var(--paper-dim);}
.exchip.ok{color:var(--verdict-green);border-color:rgba(62,138,98,.4);}
.exchip.dead{color:var(--seal-red);border-color:rgba(179,68,46,.4);}
.exchip .tick{font-weight:700;}
.juror-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;border:1px solid var(--line);
  border-radius:4px;padding:3px 8px;margin:3px 5px 0 0;color:#584f38;transition:color .3s,border-color .3s;}
.juror-chip.lit{color:var(--paper);border-color:var(--gold);}

/* ===================== STAMP ===================== */
.stamp{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:12px;
  letter-spacing:1.6px;text-transform:uppercase;padding:8px 14px;border:2px double currentColor;border-radius:4px;
  transform:rotate(-3deg);position:relative;background:var(--ink-2);
}
.stamp.mini{font-size:9px;padding:3px 8px;border-width:1px;letter-spacing:1px;transform:rotate(-3deg);}
.stamp.verdict-1{color:var(--verdict-green);}
.stamp.verdict-2{color:var(--verdict-amber);}
.stamp.verdict-3{color:var(--seal-red);}
.stamp.verdict-4{color:var(--verdict-blue);}
.stamp.verdict-0{color:var(--paper-dim);}
.stamp.landing{animation:stampland .38s cubic-bezier(.2,.9,.3,1.2);}
@keyframes stampland{
  0%{transform:scale(2.4) rotate(-3deg);opacity:0;filter:blur(3px);}
  70%{transform:scale(.96) rotate(-3deg);opacity:1;filter:blur(0);}
  85%{transform:scale(1.04) rotate(-5deg);}
  100%{transform:scale(1) rotate(-3deg);}
}
@media (prefers-reduced-motion:reduce){.stamp.landing{animation:none;}}

/* ===================== SEAL SCORE ===================== */
.seal-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.seal-num{font-family:var(--serif);font-weight:680;}
.seal-band-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper-dim);}

/* ===================== DOCKET TABLE ===================== */
.docket-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;}
.fchip{
  font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);
  border:1px solid var(--line);background:var(--ink-2);padding:6px 10px;border-radius:4px;transition:all .15s;
}
.fchip.on{color:var(--gold);border-color:var(--gold);}
.search-box{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-family:var(--mono);
  font-size:11px;color:var(--paper);min-width:180px;}
.search-box::placeholder{color:var(--paper-dim);}

table.docket{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
table.docket thead th{
  position:sticky;top:0;background:var(--ink-2);text-align:left;padding:10px 12px;font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--paper-dim);border-bottom:1px double var(--line);cursor:pointer;white-space:nowrap;
}
table.docket thead th:hover{color:var(--paper);}
table.docket tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.docket tbody tr{cursor:pointer;transition:background .12s;animation:rowIn .3s ease both;}
table.docket tbody tr:hover{background:var(--ink-2);}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
.case-id{color:var(--gold);}
.subj-cell{font-family:var(--serif);font-size:13.5px;color:var(--paper);}
.conf-cell{font-weight:600;}
.status-txt{letter-spacing:1px;}
.arrow-cell{color:var(--paper-dim);text-align:right;}
tr:hover .arrow-cell{color:var(--gold);}

@media (max-width:720px){
  table.docket thead{display:none;}
  table.docket, table.docket tbody, table.docket tr, table.docket td{display:block;width:100%;}
  table.docket tr{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:10px 12px;}
  table.docket td{border-bottom:none;padding:4px 0;}
  table.docket td::before{content:attr(data-label) ' — ';color:var(--paper-dim);}
}

/* ===================== CASE FILE ===================== */
.file-header{display:grid;grid-template-columns:1fr 300px;gap:30px;}
@media (max-width:900px){.file-header{grid-template-columns:1fr;}}
.meta-strip{font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;color:var(--paper-dim);display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.meta-strip span:not(:last-child)::after{content:'·';margin-left:8px;color:var(--line);}
.pull-quote{
  font-family:var(--serif);font-size:19px;line-height:1.45;padding-left:16px;margin:16px 0;
}
.pull-quote.seal-red{border-left:3px solid var(--seal-red);}
.pull-quote.gold{border-left:3px solid var(--gold);}
.sidecol .stamp{margin-bottom:10px;}
.sidecol{display:flex;flex-direction:column;gap:14px;}
.sc-row{font-family:var(--mono);font-size:11px;color:var(--paper-dim);}
.sc-row b{color:var(--paper);}
.action-btn{
  width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:5px;padding:11px;
  font-family:var(--mono);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;transition:all .15s;
}
.action-btn:hover{background:var(--gold);color:var(--ink);}
.action-btn[disabled]{border-color:var(--line);color:var(--paper-dim);cursor:not-allowed;}
.action-btn[disabled]:hover{background:transparent;color:var(--paper-dim);}

.tabs{display:flex;gap:4px;margin:26px 0 0;border-bottom:1px solid var(--line);}
.tab-btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);
  background:transparent;border:none;padding:10px 14px;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;
}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;}
.tab-btn.active{color:var(--paper);border-bottom-color:var(--gold);}

.exhibit-pin{padding:18px 0 4px;animation:exIn .35s ease both;}
@keyframes exIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ex-url{font-family:var(--mono);font-size:12px;color:var(--paper);word-break:break-all;}
.ex-status{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  border:1px solid var(--line);border-radius:4px;padding:3px 8px;margin:8px 0;}
.ex-preview{
  font-family:var(--mono);font-size:11.5px;color:var(--paper-dim);line-height:1.6;background:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:12px 14px;filter:blur(1.5px);transition:filter .2s;
}
.ex-preview:hover{filter:blur(0);}

.transcript-head{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);
  border-top:3px double var(--line);padding-top:14px;margin-top:26px;}
.transcript-body{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--paper);margin:12px 0;min-height:1.7em;}
.citelist{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.cite-row{font-family:var(--mono);font-size:11.5px;color:var(--verdict-blue);word-break:break-all;}
.cite-row::before{content:'⌗ ';color:var(--paper-dim);}

.appeal-history{margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--paper-dim);line-height:2;}

/* ===================== LEDGER ===================== */
.scan-bar{
  max-width:560px;margin:20px auto 30px;display:flex;align-items:center;background:var(--ink-2);border:1px solid var(--line);
  border-radius:6px;padding:14px 16px;gap:6px;font-family:var(--mono);font-size:13.5px;
}
.scan-bar .prefix{color:var(--gold);}
.scan-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:var(--mono);font-size:13.5px;}
.scan-bar input::placeholder{color:#5d5644;}

.ledger-result{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:center;}
@media (max-width:700px){.ledger-result{grid-template-columns:1fr;}}
.runrate-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);}
.runrate-row .lbl{color:var(--paper-dim);letter-spacing:.6px;}
.weighted-line{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);margin-top:12px;line-height:1.7;}

.subject-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:10px;}
.subject-table th{text-align:left;padding:9px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);border-bottom:1px double var(--line);}
.subject-table td{padding:10px 10px;border-bottom:1px solid var(--line);}
.subject-table tr{cursor:pointer;}
.subject-table tr:hover{background:var(--ink-2);}

/* ===================== PROTOCOL ===================== */
.pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
@media (max-width:900px){.pillar-grid{grid-template-columns:1fr;}}
.pillar h3{font-family:var(--serif);font-size:19px;margin:4px 0 10px;}
.pillar p{font-size:13px;line-height:1.65;color:var(--paper-dim);}

.tax-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:16px;}
.tax-table th{text-align:left;padding:9px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);border-bottom:1px double var(--line);}
.tax-table td{padding:10px 10px;border-bottom:1px solid var(--line);}

.faq-item{border-bottom:1px solid var(--line);}
.faq-q{width:100%;text-align:left;background:transparent;border:none;color:var(--paper);font-family:var(--serif);font-size:16px;
  padding:16px 0;display:flex;justify-content:space-between;align-items:center;}
.faq-q::after{content:'+';color:var(--gold);font-family:var(--mono);font-size:18px;transition:transform .2s;}
.faq-item.open .faq-q::after{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.faq-item.open .faq-a{max-height:200px;}
.faq-a p{font-size:13px;color:var(--paper-dim);line-height:1.6;padding-bottom:16px;margin:0;}

.decision-tree{margin-top:20px;}

footer.site-footer{
  border-top:1px double var(--line);padding:22px 40px;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--paper-dim);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;
}
footer.site-footer a{text-decoration:none;border-bottom:1px dotted var(--line);}

.section-title{font-family:var(--serif);font-size:26px;font-weight:560;margin:0 0 4px;}

function subjectScore(subject){
  const cs = CASES.filter(c=>c.subject===subject && c.status!=='PENDING');
  if(cs.length===0) return {subject, totalVerdicts:0, verified:0, partial:0, contradicted:0, unverifiable:0, score:50, lastVerdict:'NONE'};
  let v=0,p=0,c=0,u=0;
  cs.forEach(k=>{ if(k.verdict===1)v++; else if(k.verdict===2)p++; else if(k.verdict===3)c++; else if(k.verdict===4)u++; });
  const weighted = v*1 + p*0.5 + u*0.25 + c*0;
  const score = Math.round((weighted/cs.length)*100);
  const last = cs.slice().sort((a,b)=>new Date(b.filed)-new Date(a.filed))[0];
  return {subject, totalVerdicts:cs.length, verified:v, partial:p, contradicted:c, unverifiable:u, score, lastVerdict:VERDICT_LABEL[last.verdict]};
}

function timeAgo(iso){
  const diff = (now - new Date(iso).getTime())/1000;
  if(diff < 3600) return Math.round(diff/60)+'m ago';
  if(diff < 86400) return Math.round(diff/3600)+'h ago';
  return Math.round(diff/86400)+'d ago';
}
function utc(iso){
  const d = new Date(iso);
  return d.toISOString().slice(11,19)+' UTC';
}
function dateShort(iso){ return new Date(iso).toISOString().slice(0,10); }

function Stamp(verdictCode, {mini=false, landing=false}={}){
  const cls = `stamp ${mini?'mini':''} ${VERDICT_CLASS[verdictCode]} ${landing?'landing':''}`;
  return `<span class="${cls}">${VERDICT_LABEL[verdictCode]}</span>`;
}

function sealBand(score){
  if(score===50) return {color:'var(--paper-dim)', label:'NO DATA'};
  if(score>=70) return {color:'var(--verdict-green)', label:'TRUSTED'};
  if(score>=40) return {color:'var(--verdict-amber)', label:'MIXED'};
  return {color:'var(--seal-red)', label:'FLAGGED'};
}

function seed(str){ let h=0; for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;} return h; }

function SealScore(subject, score, size=96){
  const band = sealBand(score);
  const r = size/2 - 8;
  const cx = size/2, cy = size/2;
  const pts = 14;
  let path = '';
  const rnd = seed(subject+score);
  for(let i=0;i<=pts;i++){
    const a = (i/pts)*Math.PI*2;
    const wob = ((rnd>>(i%20)) % 5) - 2;
    const rr = r + (score===50?0:wob*0.8);
    const x = cx + rr*Math.cos(a), y = cy + rr*Math.sin(a);
    path += (i===0?'M':'L') + x.toFixed(1)+','+y.toFixed(1)+' ';
  }
  const fs = size*0.30;
  return `
  <div class="seal-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <path d="${path}Z" fill="none" stroke="${band.color}" stroke-width="2.5"/>
      <circle cx="${cx}" cy="${cy}" r="${r-9}" fill="none" stroke="${band.color}" stroke-width="1" opacity=".5"/>
      <text x="${cx}" y="${cy+fs*0.33}" text-anchor="middle" fill="${band.color}" font-family="Fraunces" font-size="${fs}" font-weight="680">${score===50?'—':score}</text>
    </svg>
    <div class="seal-band-label" style="color:${band.color}">${band.label}</div>
  </div>`;
}

function ExhibitPin(url, status, idx){
  const ok = status===200;
  const err = status==='ERR';
  const statusText = err ? 'error · timeout' : ok ? 'fetched · 200' : `dead · ${status}`;
  const statusColor = err ? 'var(--seal-red)' : ok ? 'var(--verdict-green)' : 'var(--seal-red)';
  const previews = [
    "SPDX-License-Identifier: MIT // pragma solidity ^0.8.20; contract Registry { mapping(address => Report) public reports; event Filed(uint256 indexed id, address...",
    "audit report — engagement #A-2291, scope: core AMM, staking, treasury multisig. Findings: 2 low, 0 critical. Signed 2026-03-11...",
    "404 Not Found — nginx/1.24 — the requested resource could not be located on this server...",
  ];
  return `<div class="exhibit-pin">
    <div class="ex-url">${url}</div>
    <div class="ex-status" style="color:${statusColor};border-color:${statusColor}55">${statusText}</div>
    <div class="ex-preview">${err? 'connection timeout after 3 retries — no content retrieved' : previews[idx%previews.length]}</div>
  </div>`;
}

  document.getElementById('filingForm').onsubmit = (e)=>{ e.preventDefault(); runDemoFiling(); };

  playBoard(CASES[1], true); // replay defiplatform.xyz contradicted case on load
}

function playBoard(c, loop){
  const board = document.getElementById('board');
  if(!board) return;
  const exStatus = c.exStatus;
  board.innerHTML = `
    <div class="board-item"><div class="thumb"></div><div>
      <div class="board-item-title">Evidence fetched</div>
      <div class="board-item-body" id="b-ex">${c.evidence.map((u,i)=>`<span class="exchip" data-i="${i}"><span class="tick">…</span> ${new URL(u).hostname}</span>`).join('')}</div>
    </div></div>
    <div class="board-item"><div class="thumb" style="background:var(--gold)"></div><div>
      <div class="board-item-title">Jury deliberation</div>
      <div class="board-item-body" id="b-jury">
        <span class="juror-chip" data-j="claude">CLAUDE</span><span class="juror-chip" data-j="gpt">GPT</span><span class="juror-chip" data-j="gemini">GEMINI</span>
        <div id="b-agree" style="margin-top:6px;color:var(--paper-dim);font-family:var(--mono);font-size:10.5px;"></div>
      </div>
    </div></div>
    <div class="board-item"><div class="thumb" style="background:${VERDICT_COLOR[c.verdict]}"></div><div>
      <div class="board-item-title">Verdict recorded</div>
      <div class="board-item-body" id="b-stamp"></div>
    </div></div>
    <div class="board-item"><div class="thumb" style="background:var(--verdict-blue)"></div><div>
      <div class="board-item-title">Seal updated</div>
      <div class="board-item-body" id="b-seal" style="color:var(--paper-dim)">${c.subject} · recalculating…</div>
    </div></div>
  `;
  let t=0;
  c.evidence.forEach((u,i)=>{
    t += 380;
    setTimeout(()=>{
      const el = board.querySelector(`.exchip[data-i="${i}"]`);
      if(!el) return;
      const ok = exStatus[i]===200;
      el.classList.add(ok?'ok':'dead');
      el.querySelector('.tick').textContent = ok?'✓':'✕';
      el.innerHTML = el.innerHTML.replace('…', ok?'fetched 200 · 1.2s':`dead ${exStatus[i]}`);
    }, t);
  });
  ['claude','gpt','gemini'].forEach((j,i)=>{
    t += 260;
    setTimeout(()=>{ const el = board.querySelector(`.juror-chip[data-j="${j}"]`); if(el) el.classList.add('lit'); }, t);
  });
  t += 300;
  setTimeout(()=>{ const el = board.querySelector('#b-agree'); if(el) el.textContent = 'AGREEMENT: 2/3'; }, t);
  t += 400;
  setTimeout(()=>{ const el = board.querySelector('#b-stamp'); if(el) el.innerHTML = Stamp(c.verdict,{landing:true}); }, t);
  t += 500;
  setTimeout(()=>{ const el = board.querySelector('#b-seal'); if(el){ const sc = subjectScore(c.subject); el.style.color='var(--paper)'; el.textContent = `${c.subject} · seal now ${sc.score}`; } }, t);
}

function runDemoFiling(){
  const subject = document.getElementById('f-subject').value.trim() || 'unknown-subject.xyz';
  const claim = document.getElementById('f-claim').value.trim() || 'Untitled claim.';
  const urls = [...document.querySelectorAll('#exRows input')].map(i=>i.value.trim()).filter(Boolean);
  const type = document.querySelector('.type-chip.selected')?.dataset.type || 'audit';
  const verdictPool = [1,2,3,4];
  const verdict = verdictPool[Math.floor(Math.random()*verdictPool.length)];
  const confidence = 55 + Math.floor(Math.random()*40);
  const newCase = {
    id: CASES.length+1, subject, type, claim,
    evidence: urls.length?urls:['https://example.com/evidence'],
    stake:10, status:'PENDING', verdict:0, confidence:0, appeals:0, filed:new Date().toISOString(),
    rationale:'', citations:[], exStatus:(urls.length?urls:[1]).map(()=> Math.random()>0.25?200:404),
  };
  CASES.unshift(newCase);
  document.querySelector('.folder-tab').textContent = `Case #${String(newCase.id).padStart(4,'0')}`;
  playBoard(newCase);
  setTimeout(()=>{
    newCase.status='VERDICTED'; newCase.verdict=verdict; newCase.confidence=confidence;
    newCase.rationale = 'The jury cross-referenced the submitted exhibits against public registries and on-chain records to reach this verdict.';
    newCase.citations = newCase.evidence.slice(0,2);
    renderRail(); renderTicker();
  }, 2600);
  document.getElementById('filingForm').reset();
  document.querySelectorAll('.type-chip').forEach((c,i)=>c.classList.toggle('selected', i===0));
  document.getElementById('exRows').innerHTML = `<div class="exhibit-row"><span class="ex-label">EXHIBIT A</span><input class="field" placeholder="https://…"/></div>`;
}

let docketSort = {key:'filed', dir:-1};
let docketFilter = null;
let docketSearch = '';

function screenDocket(){
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="eyebrow">The docket</div>
    <h2 class="section-title" style="margin-top:6px">All cases on record</h2>
    <div class="docket-toolbar">
      <div class="filter-chips" id="fchips">
        ${['VERIFIED','PARTIAL','CONTRADICTED','UNVERIFIABLE','APPEALING','PENDING'].map(v=>`<button class="fchip ${docketFilter===v?'on':''}" data-v="${v}">${v}</button>`).join('')}
      </div>
      <input class="search-box" id="dsearch" placeholder="search subject…" value="${docketSearch}"/>
    </div>
    <div style="overflow-x:auto">
    <table class="docket">
      <thead><tr>
        <th data-k="id">#</th><th data-k="subject">Subject</th><th data-k="type">Type</th><th data-k="status">Status</th>
        <th data-k="verdict">Verdict</th><th data-k="confidence">Confidence</th><th data-k="filed">Filed (UTC)</th><th data-k="stake">Stake</th><th></th>
      </tr></thead>
      <tbody id="docketBody"></tbody>
    </table>
    </div>
  `;
  document.querySelectorAll('.fchip').forEach(c=>c.onclick=()=>{ docketFilter = docketFilter===c.dataset.v?null:c.dataset.v; renderDocketBody(); document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on', x.dataset.v===docketFilter)); });
  document.getElementById('dsearch').oninput = (e)=>{ docketSearch = e.target.value; renderDocketBody(); };
  document.querySelectorAll('table.docket thead th[data-k]').forEach(th=>th.onclick=()=>{
    const k = th.dataset.k;
    docketSort.dir = docketSort.key===k ? -docketSort.dir : -1;
    docketSort.key = k;
    renderDocketBody();
  });
  renderDocketBody();
}
function renderDocketBody(){
  let rows = CASES.slice();
  if(docketFilter){
    const map = {VERIFIED:1,PARTIAL:2,CONTRADICTED:3,UNVERIFIABLE:4};
    if(docketFilter==='APPEALING') rows = rows.filter(c=>c.status==='APPEALING');
    else if(docketFilter==='PENDING') rows = rows.filter(c=>c.status==='PENDING');
    else rows = rows.filter(c=>c.verdict===map[docketFilter]);
  }
  if(docketSearch) rows = rows.filter(c=>c.subject.toLowerCase().includes(docketSearch.toLowerCase()));
  const key = docketSort.key, dir = docketSort.dir;
  rows.sort((a,b)=>{
    let av,bv;
    if(key==='id'){av=a.id;bv=b.id;}
    else if(key==='filed'){av=new Date(a.filed).getTime();bv=new Date(b.filed).getTime();}
    else if(key==='confidence'){av=a.confidence;bv=b.confidence;}
    else if(key==='stake'){av=a.stake;bv=b.stake;}
    else {av=(a[key]||'').toString();bv=(b[key]||'').toString();}
    if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
  });
  const body = document.getElementById('docketBody');
  if(rows.length===0){ body.innerHTML = `<tr><td colspan="9"><div class="empty-state">The docket is empty. File the first case.</div></td></tr>`; return; }
  body.innerHTML = rows.map(DocketRow).join('');
}

function screenCase(id){

        </div>
      </div>

      ${c.evidence.length ? `
      <div class="tabs" id="exTabs">

        }).join('')}
      </div>
      <div id="exBody">${ExhibitPin(c.evidence[0], c.exStatus[0], 0)}</div>

      ` : `<div class="transcript-head">Jury transcript</div><div class="transcript-body" style="color:var(--paper-dim)">The jury has not yet convened on this case.</div>`}

      ${c.appealLog ? `<div class="appeal-history">${c.appealLog.map(a=>`L${a.n} · ${dateShort(a.date)} · ${a.note}`).join('<br>')}</div>` : ''}
    </div>
  `;
  if(c.evidence.length){
    document.querySelectorAll('#exTabs .tab-btn').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#exTabs .tab-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const i = +b.dataset.i;
      document.getElementById('exBody').innerHTML = ExhibitPin(c.evidence[i], c.exStatus[i], i);
    });
  }
  if(c.status!=='PENDING' && c.rationale) typewrite(document.getElementById('transcriptBody'), c.rationale);

function typewrite(el, text){
  const reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
  if(reduced){ el.textContent = text; return; }
  let i=0;
  el.textContent='';
  const step = ()=>{
    if(i<=text.length){ el.textContent = text.slice(0,i); i++; setTimeout(step, 16); }
  };
  step();
}
function submitAppeal(id){
  const c = CASES.find(x=>x.id===id);
  c.status='APPEALING'; c.appeals=(c.appeals||0)+1;
  c.appealLog = c.appealLog||[];
  c.appealLog.push({n:c.appeals, date:new Date().toISOString(), note:'APPEAL FILED — awaiting re-adjudication'});
  screenCase(id);
}

  const hist = CASES.filter(c=>c.subject===subject).sort((a,b)=>new Date(b.filed)-new Date(a.filed));

    <div class="folder">
      <div class="folder-tab">${subject}</div>
      <div class="ledger-result">
        ${SealScore(subject, sc.score, 130)}
        <div>

          <div class="runrate-row"><span class="lbl">UNVERIFIABLE</span><span style="color:var(--verdict-blue)">${sc.unverifiable}</span></div>
          <div class="weighted-line">SCORE ${sc.score}/100 · WEIGHTED — VERIFIED 1.0 · PARTIAL 0.5 · UNVERIFIABLE 0.25 · CONTRADICTED 0.0</div>
        </div>
      </div>
      <h4 style="font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);margin-top:26px">History</h4>
      <table class="docket" style="margin-top:8px"><tbody>
        ${hist.map(c=>`<tr onclick="location.hash='#/case/${c.id}'">
          <td data-label="#"><span class="case-id">#${String(c.id).padStart(4,'0')}</span></td>
          <td data-label="Type" style="text-transform:uppercase;font-size:10.5px;color:var(--paper-dim)">${TYPES.find(t=>t.id===c.type).label}</td>

  `;
}

function screenProtocol(){
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="eyebrow">Protocol</div>
    <h2 class="section-title" style="margin-top:6px">How a claim becomes a record</h2>
    <div class="pillar-grid">
      <div class="folder pillar"><div class="folder-tab">Exhibit 1</div><h3>The fetch</h3>

        <p>A leader model drafts a verdict; validator models independently check it against the same evidence. Diverse model families, judgment rather than keyword matching, resolved by the Equivalence Principle.</p></div>
      <div class="folder pillar"><div class="folder-tab">Exhibit 3</div><h3>The record</h3>

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  const h = location.hash || '#/preflight';
  renderRail();
  window.scrollTo(0,0);
  if(h.startsWith('#/case/')){
    screenCase(parseInt(h.split('/')[2]));
  } else if(h.startsWith('#/docket')){
    screenDocket();
  } else if(h.startsWith('#/ledger')){
    const parts = h.split('/');
    screenLedger(parts[2]?decodeURIComponent(parts[2]):null);
  } else if(h.startsWith('#/protocol')){
    screenProtocol();
  } else {
    screenPreflight();
  }
}
window.addEventListener('hashchange', route);
renderTicker();
route();
