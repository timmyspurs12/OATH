<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OATH — Every claim faces a jury.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,560;9..144,680&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --ink:#131009; --ink-2:#1C1712; --ink-3:#262017; --line:#2E2619;
  --paper:#F2EBDD; --paper-dim:#A89C82;
  --seal-red:#B3442E; --verdict-green:#3E8A62; --verdict-amber:#C08A2E; --verdict-blue:#4E7CA8;
  --gold:#D9A83C;
  --serif:'Fraunces', Georgia, serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --sans:'Inter', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--sans);}
body{position:relative;min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold);color:var(--ink);}

/* paper grain overlay */
#grain{
  position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.045;mix-blend-mode:overlay;
}

/* ===================== LAYOUT ===================== */
#app{display:flex;min-height:100vh;}
#rail{
  width:280px;flex:0 0 280px;border-right:1px solid var(--line);background:var(--ink-2);
  padding:22px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;
}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#content{flex:1;padding:34px 40px 60px;max-width:1240px;width:100%;margin:0 auto;}

.brand{display:flex;flex-direction:column;gap:2px;}
.brand-mark{font-family:var(--serif);font-size:26px;font-weight:680;letter-spacing:.5px;}
.brand-mark span{color:var(--seal-red);}
.brand-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper-dim);}

.navlist{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.navitem{
  font-family:var(--mono);font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--paper-dim);text-decoration:none;padding:9px 10px;border-radius:3px;border:1px solid transparent;
  display:flex;align-items:center;gap:9px;transition:background .15s,color .15s,border-color .15s;
}
.navitem:hover{color:var(--paper);background:var(--ink-3);}
.navitem.active{color:var(--gold);border-color:var(--line);background:var(--ink-3);}
.navitem .dot{width:5px;height:5px;border-radius:1px;background:currentColor;flex:0 0 auto;}

.rail-stats{border-top:1px double var(--line);padding-top:16px;display:flex;flex-direction:column;gap:11px;}
.rail-stat-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.4px;}
.rail-stat-row .k{color:var(--paper-dim);text-transform:uppercase;}
.rail-stat-row .v{color:var(--paper);}

.rail-seal{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);}
.rail-seal-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:8px;}

#topbar{display:none;}

@media (max-width:900px){
  #rail{display:none;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);background:var(--ink-2);position:sticky;top:0;z-index:50;
  }
  #topbar .brand-mark{font-size:19px;}
  #topbar select{background:var(--ink-3);color:var(--paper);border:1px solid var(--line);font-family:var(--mono);
    font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:7px 8px;border-radius:3px;}
  #content{padding:22px 16px 50px;}
}

/* ===================== WIRE TICKER ===================== */
.ticker-wrap{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--ink-2);
  overflow:hidden;white-space:nowrap;position:relative;
}
.ticker-track{display:inline-flex;gap:40px;padding:9px 0;animation:ticker 42s linear infinite;}
.ticker-wrap:hover .ticker-track{animation-play-state:paused;}
.ticker-item{font-family:var(--mono);font-size:11px;letter-spacing:.6px;color:var(--paper-dim);display:inline-flex;gap:8px;align-items:center;}
.ticker-item b{color:var(--paper);font-weight:500;}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;}}


/* ===================== FOLDER CARD ===================== */
.folder{
  background:var(--ink-2);border:1px solid var(--line);border-radius:8px;position:relative;padding:26px 24px 22px;
  margin-top:22px;
}
.folder-tab{
  position:absolute;top:-15px;left:22px;background:var(--ink-3);border:1px solid var(--line);border-bottom:none;
  border-radius:5px 5px 0 0;padding:5px 12px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--gold);
}

/* ===================== HERO / S1 ===================== */
.hero-grid{display:grid;grid-template-columns:58fr 42fr;gap:34px;align-items:start;}
@media (max-width:1050px){.hero-grid{grid-template-columns:1fr;}}

h1.hero-headline{
  font-family:var(--serif);font-weight:560;font-size:clamp(32px,4.6vw,52px);line-height:1.05;margin:6px 0 12px;
  letter-spacing:-0.5px;
}
.hero-sub{font-size:14.5px;line-height:1.6;color:var(--paper-dim);max-width:52ch;margin:0 0 22px;}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--seal-red);}

.filing-steps{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim);
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.filing-steps span:not(:last-child)::after{content:'·';margin-left:6px;color:var(--line);}

label.field-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--paper-dim);margin:16px 0 6px;}
.field-label b{color:var(--gold);}
input.field, textarea.field{
  width:100%;background:var(--ink-3);border:1px solid var(--line);border-radius:5px;color:var(--paper);
  padding:11px 12px;font-size:13.5px;outline:none;transition:border-color .15s;
}
input.field{font-family:var(--mono);}
textarea.field{font-family:var(--serif);font-size:15px;line-height:1.5;min-height:78px;resize:vertical;}
input.field:focus, textarea.field:focus{border-color:var(--gold);}
input.field::placeholder, textarea.field::placeholder{color:#5d5644;}

.exhibit-rows{display:flex;flex-direction:column;gap:7px;}
.exhibit-row{display:flex;align-items:center;gap:8px;}
.exhibit-row .ex-label{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:1px;width:64px;flex:0 0 auto;}
.ghost-btn{
  background:transparent;border:1px dashed var(--line);color:var(--paper-dim);font-family:var(--mono);
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border-radius:5px;margin-top:8px;
  transition:border-color .15s,color .15s;
}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.type-chip{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--ink-3);color:var(--paper-dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;padding:8px 11px;
  border-radius:5px;transition:all .15s;
}
.type-chip svg{width:13px;height:13px;stroke:currentColor;fill:none;}
.type-chip:hover{color:var(--paper);}
.type-chip.selected{border-color:var(--gold);color:var(--gold);background:rgba(217,168,60,.08);}

.submit-btn{
  margin-top:20px;background:var(--paper);color:var(--ink);border:none;border-radius:5px;padding:13px 22px;
  font-family:var(--mono);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;
  transition:background .15s;
}
.submit-btn:hover{background:var(--gold);}
.stake-line{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);letter-spacing:.5px;margin-top:10px;}

.demo-banner{
  border:1px solid var(--line);background:var(--ink-3);border-left:3px solid var(--gold);border-radius:0 5px 5px 0;
  padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--paper-dim);line-height:1.6;margin-bottom:18px;
}
.demo-banner a{color:var(--gold);text-decoration:underline;}

/* caseboard */
.board-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);position:relative;}
.board-item:last-child{border-bottom:none;}
.thumb{width:6px;height:6px;border-radius:50%;background:var(--seal-red);margin-top:5px;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(179,68,46,.18);}
.board-item-title{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:5px;}
.board-item-body{font-size:12.5px;color:var(--paper);}
.exchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;border:1px solid var(--line);
  border-radius:4px;padding:3px 7px;margin:3px 5px 0 0;color:var(--paper-dim);}
.exchip.ok{color:var(--verdict-green);border-color:rgba(62,138,98,.4);}
.exchip.dead{color:var(--seal-red);border-color:rgba(179,68,46,.4);}
.exchip .tick{font-weight:700;}
.juror-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;border:1px solid var(--line);
  border-radius:4px;padding:3px 8px;margin:3px 5px 0 0;color:#584f38;transition:color .3s,border-color .3s;}
.juror-chip.lit{color:var(--paper);border-color:var(--gold);}

/* ===================== STAMP ===================== */
.stamp{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:12px;
  letter-spacing:1.6px;text-transform:uppercase;padding:8px 14px;border:2px double currentColor;border-radius:4px;
  transform:rotate(-3deg);position:relative;background:var(--ink-2);
}
.stamp.mini{font-size:9px;padding:3px 8px;border-width:1px;letter-spacing:1px;transform:rotate(-3deg);}
.stamp.verdict-1{color:var(--verdict-green);}
.stamp.verdict-2{color:var(--verdict-amber);}
.stamp.verdict-3{color:var(--seal-red);}
.stamp.verdict-4{color:var(--verdict-blue);}
.stamp.verdict-0{color:var(--paper-dim);}
.stamp.landing{animation:stampland .38s cubic-bezier(.2,.9,.3,1.2);}
@keyframes stampland{
  0%{transform:scale(2.4) rotate(-3deg);opacity:0;filter:blur(3px);}
  70%{transform:scale(.96) rotate(-3deg);opacity:1;filter:blur(0);}
  85%{transform:scale(1.04) rotate(-5deg);}
  100%{transform:scale(1) rotate(-3deg);}
}
@media (prefers-reduced-motion:reduce){.stamp.landing{animation:none;}}

/* ===================== SEAL SCORE ===================== */
.seal-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.seal-num{font-family:var(--serif);font-weight:680;}
.seal-band-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper-dim);}

/* ===================== DOCKET TABLE ===================== */
.docket-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;}
.fchip{
  font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);
  border:1px solid var(--line);background:var(--ink-2);padding:6px 10px;border-radius:4px;transition:all .15s;
}
.fchip.on{color:var(--gold);border-color:var(--gold);}
.search-box{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-family:var(--mono);
  font-size:11px;color:var(--paper);min-width:180px;}
.search-box::placeholder{color:var(--paper-dim);}

table.docket{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
table.docket thead th{
  position:sticky;top:0;background:var(--ink-2);text-align:left;padding:10px 12px;font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--paper-dim);border-bottom:1px double var(--line);cursor:pointer;white-space:nowrap;
}
table.docket thead th:hover{color:var(--paper);}
table.docket tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.docket tbody tr{cursor:pointer;transition:background .12s;animation:rowIn .3s ease both;}
table.docket tbody tr:hover{background:var(--ink-2);}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
.case-id{color:var(--gold);}
.subj-cell{font-family:var(--serif);font-size:13.5px;color:var(--paper);}
.conf-cell{font-weight:600;}
.status-txt{letter-spacing:1px;}
.arrow-cell{color:var(--paper-dim);text-align:right;}
tr:hover .arrow-cell{color:var(--gold);}

@media (max-width:720px){
  table.docket thead{display:none;}
  table.docket, table.docket tbody, table.docket tr, table.docket td{display:block;width:100%;}
  table.docket tr{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:10px 12px;}
  table.docket td{border-bottom:none;padding:4px 0;}
  table.docket td::before{content:attr(data-label) ' — ';color:var(--paper-dim);}
}

/* ===================== CASE FILE ===================== */
.file-header{display:grid;grid-template-columns:1fr 300px;gap:30px;}
@media (max-width:900px){.file-header{grid-template-columns:1fr;}}
.meta-strip{font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;color:var(--paper-dim);display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.meta-strip span:not(:last-child)::after{content:'·';margin-left:8px;color:var(--line);}
.pull-quote{
  font-family:var(--serif);font-size:19px;line-height:1.45;padding-left:16px;margin:16px 0;
}
.pull-quote.seal-red{border-left:3px solid var(--seal-red);}
.pull-quote.gold{border-left:3px solid var(--gold);}
.sidecol .stamp{margin-bottom:10px;}
.sidecol{display:flex;flex-direction:column;gap:14px;}
.sc-row{font-family:var(--mono);font-size:11px;color:var(--paper-dim);}
.sc-row b{color:var(--paper);}
.action-btn{
  width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:5px;padding:11px;
  font-family:var(--mono);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;transition:all .15s;
}
.action-btn:hover{background:var(--gold);color:var(--ink);}
.action-btn[disabled]{border-color:var(--line);color:var(--paper-dim);cursor:not-allowed;}
.action-btn[disabled]:hover{background:transparent;color:var(--paper-dim);}

.tabs{display:flex;gap:4px;margin:26px 0 0;border-bottom:1px solid var(--line);}
.tab-btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);
  background:transparent;border:none;padding:10px 14px;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;
}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;}
.tab-btn.active{color:var(--paper);border-bottom-color:var(--gold);}

.exhibit-pin{padding:18px 0 4px;animation:exIn .35s ease both;}
@keyframes exIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ex-url{font-family:var(--mono);font-size:12px;color:var(--paper);word-break:break-all;}
.ex-status{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  border:1px solid var(--line);border-radius:4px;padding:3px 8px;margin:8px 0;}
.ex-preview{
  font-family:var(--mono);font-size:11.5px;color:var(--paper-dim);line-height:1.6;background:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:12px 14px;filter:blur(1.5px);transition:filter .2s;
}
.ex-preview:hover{filter:blur(0);}

.transcript-head{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);
  border-top:3px double var(--line);padding-top:14px;margin-top:26px;}
.transcript-body{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--paper);margin:12px 0;min-height:1.7em;}
.citelist{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.cite-row{font-family:var(--mono);font-size:11.5px;color:var(--verdict-blue);word-break:break-all;}
.cite-row::before{content:'⌗ ';color:var(--paper-dim);}

.appeal-history{margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--paper-dim);line-height:2;}

/* ===================== LEDGER ===================== */
.scan-bar{
  max-width:560px;margin:20px auto 30px;display:flex;align-items:center;background:var(--ink-2);border:1px solid var(--line);
  border-radius:6px;padding:14px 16px;gap:6px;font-family:var(--mono);font-size:13.5px;
}
.scan-bar .prefix{color:var(--gold);}
.scan-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:var(--mono);font-size:13.5px;}
.scan-bar input::placeholder{color:#5d5644;}

.ledger-result{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:center;}
@media (max-width:700px){.ledger-result{grid-template-columns:1fr;}}
.runrate-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);}
.runrate-row .lbl{color:var(--paper-dim);letter-spacing:.6px;}
.weighted-line{font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);margin-top:12px;line-height:1.7;}

.subject-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:10px;}
.subject-table th{text-align:left;padding:9px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);border-bottom:1px double var(--line);}
.subject-table td{padding:10px 10px;border-bottom:1px solid var(--line);}
.subject-table tr{cursor:pointer;}
.subject-table tr:hover{background:var(--ink-2);}

/* ===================== PROTOCOL ===================== */
.pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
@media (max-width:900px){.pillar-grid{grid-template-columns:1fr;}}
.pillar h3{font-family:var(--serif);font-size:19px;margin:4px 0 10px;}
.pillar p{font-size:13px;line-height:1.65;color:var(--paper-dim);}

.tax-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:16px;}
.tax-table th{text-align:left;padding:9px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);border-bottom:1px double var(--line);}
.tax-table td{padding:10px 10px;border-bottom:1px solid var(--line);}

.faq-item{border-bottom:1px solid var(--line);}
.faq-q{width:100%;text-align:left;background:transparent;border:none;color:var(--paper);font-family:var(--serif);font-size:16px;
  padding:16px 0;display:flex;justify-content:space-between;align-items:center;}
.faq-q::after{content:'+';color:var(--gold);font-family:var(--mono);font-size:18px;transition:transform .2s;}
.faq-item.open .faq-q::after{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.faq-item.open .faq-a{max-height:200px;}
.faq-a p{font-size:13px;color:var(--paper-dim);line-height:1.6;padding-bottom:16px;margin:0;}

.decision-tree{margin-top:20px;}

footer.site-footer{
  border-top:1px double var(--line);padding:22px 40px;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--paper-dim);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;
}
footer.site-footer a{text-decoration:none;border-bottom:1px dotted var(--line);}

.section-title{font-family:var(--serif);font-size:26px;font-weight:560;margin:0 0 4px;}
.section-sub{font-family:var(--mono);font-size:11px;color:var(--paper-dim);letter-spacing:.6px;margin:0 0 4px;}

.empty-state{padding:60px 20px;text-align:center;font-family:var(--mono);color:var(--paper-dim);font-size:13px;letter-spacing:.6px;}

/* ===================== LIVE NETWORK BADGE ===================== */
.net-badge{
  position:fixed;top:16px;right:18px;z-index:200;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--paper);background:var(--ink-2);border:1px solid var(--line);

<body>
<svg id="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseF"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>

</svg>

<div id="app">
  <aside id="rail"></aside>
  <div id="main">
    <div id="topbar"></div>
    <div id="ticker" class="ticker-wrap"></div>
    <main id="content"></main>
    <footer class="site-footer">
      <span>OATH — CLAIM VERIFICATION PROTOCOL</span>
      <span>INTELLIGENT CONTRACTS ON GENLAYER · STUDIO + BRADBURY</span>
      <span id="footerContract">NO CONTRACT CONFIGURED</span>
      <span><a href="#/protocol">PROTOCOL</a> · <a href="https://github.com/timmyspurs12/OATH" target="_blank" rel="noopener">GITHUB</a> · <a href="https://explorer-bradbury.genlayer.com" target="_blank" rel="noopener">EXPLORER</a></span>
    </footer>
  </div>
</div>
<div class="net-badge" id="netBadge"><span class="pip"></span> <span id="netBadgeText">GENLAYER STUDIO</span></div>

<script type="module">
/* ============================================================
   OATH — LIVE GENLAYER FRONTEND
   All state is derived from OathRegistry view calls. There is no
   seeded docket, no simulated verdict/appeal/fetch, and no local
   trust math. Reads use a wallet-less client; writes go through an
   EIP-1193 wallet (MetaMask) on the selected GenLayer network.
   ============================================================ */

/*
 * Live deployment: OathRegistry is deployed on the GenLayer Studio Network
 * (chain 61999). The app defaults to it so the GitHub Pages URL shows real
 * on-chain state out-of-the-box. Bradbury (4221) is one click away.
 */
const NETWORKS = {
  studionet: {
    key: 'studionet', label: 'GENLAYER STUDIO', sdkChain: 'studionet',
    chainId: '0xF22F',                                         // 61999
    chainName: 'GenLayer Studio Network',
    rpcUrl: 'https://studio.genlayer.com/api',
    explorer: 'https://explorer-studio.genlayer.com',
  },
  bradbury: {
    key: 'bradbury', label: 'GENLAYER BRADBURY', sdkChain: 'testnetBradbury',
    chainId: '0x107D',                                         // 4221
    chainName: 'GenLayer Bradbury Testnet',
    rpcUrl: 'https://rpc-bradbury.genlayer.com',
    explorer: 'https://explorer-bradbury.genlayer.com',
  },
};
const DEFAULT_NETWORK = 'studionet';
const DEFAULT_CONTRACT = '0xe9B73DD18446a1f121090a21C544D51349a1e8Ad';
const FAUCET = 'https://testnet-faucet.genlayer.foundation/';
const GEN = 10n ** 18n;

function net(){ return NETWORKS[STATE.network] || NETWORKS[DEFAULT_NETWORK]; }
function explorerAddr(addr){ return `${net().explorer}/address/${addr}`; }
function explorerTx(h){ return `${net().explorer}/tx/${h}`; }

/* ---- verdict codes (must mirror contracts/oath_registry.py) ---- */
const VERDICT_LABEL = {0:'NONE',1:'VERIFIED',2:'PARTIALLY VERIFIED',3:'CONTRADICTED',4:'UNVERIFIABLE'};
const VERDICT_SHORT = {0:'NONE',1:'VERIFIED',2:'PARTIAL',3:'CONTRADICTED',4:'UNVERIFIABLE'};
const VERDICT_CLASS = {0:'verdict-0',1:'verdict-1',2:'verdict-2',3:'verdict-3',4:'verdict-4'};
const VERDICT_COLOR = {0:'var(--paper-dim)',1:'var(--verdict-green)',2:'var(--verdict-amber)',3:'var(--seal-red)',4:'var(--verdict-blue)'};

/* ============================================================
   SDK LOADING (genlayer-js via ESM CDN — no build step)
   ============================================================ */
let SDK = null;
async function loadSDK(){
  if(SDK) return SDK;
  const [gl, types] = await Promise.all([
    import('https://esm.sh/genlayer-js@1.1.8'),
    import('https://esm.sh/genlayer-js@1.1.8/types'),
  ]);
  SDK = { ...gl, ...types };
  return SDK;
}

/* ============================================================
   APP STATE / CONFIG
   ============================================================ */
const STATE = {
  network: DEFAULT_NETWORK,
  address: null,        // OathRegistry address
  readClient: null,
  writeClient: null,
  account: null,        // connected wallet address
  sdkReady: false,
  sdkError: null,
  cases: [],            // mapped from get_claim(1..N)
  stats: null,          // get_stats()
  subjects: new Set(),  // discovered subjects
  loading: false,
};

function networkKey(){
  const q = new URLSearchParams(location.search).get('network');
  if(q && NETWORKS[q]){ localStorage.setItem('oath_network', q); return q; }
  const saved = localStorage.getItem('oath_network');
  return (saved && NETWORKS[saved]) ? saved : DEFAULT_NETWORK;
}
function contractAddress(){
  const q = new URLSearchParams(location.search).get('contract');
  if(q && /^0x[0-9a-fA-F]{40}$/.test(q)){ localStorage.setItem('oath_contract_'+STATE.network, q); return q; }
  const saved = localStorage.getItem('oath_contract_'+STATE.network);
  if(saved && /^0x[0-9a-fA-F]{40}$/.test(saved)) return saved;
  // Ship the deployed Studio contract as the default so the live app shows
  // real on-chain state with zero configuration.
  return STATE.network === DEFAULT_NETWORK ? DEFAULT_CONTRACT : null;
}
function setContractAddress(addr){
  localStorage.setItem('oath_contract_'+STATE.network, addr);
  STATE.address = addr;
  STATE.cases = []; STATE.stats = null; STATE.subjects = new Set();
}

/* ============================================================
   LOW-LEVEL READ / WRITE
   ============================================================ */
function num(v){ if(v==null) return 0; if(typeof v==='bigint') return Number(v); if(typeof v==='number') return v; const n=Number(v); return Number.isFinite(n)?n:0; }
function fmtGEN(wei){ return (Number(BigInt(num(wei)))/1e18).toFixed(2) + ' GEN'; }
function shortAddr(a){ if(!a) return '—'; return a.slice(0,6)+'…'+a.slice(-4); }

async function readView(functionName, args=[]){
  const { readClient, address } = STATE;
  if(!readClient || !address) throw new Error('no contract');
  return await readClient.readContract({ address, functionName, args, stateStatus: 'accepted' });
}

function sdkChainFor(sdk, networkKey){
  if(networkKey === 'bradbury') return sdk.testnetBradbury;
  if(networkKey === 'studionet') return sdk.studionet;
  return sdk.studionet;
}
async function ensureReadClient(){
  const sdk = await loadSDK();
  STATE.readClient = sdk.createClient({ chain: sdkChainFor(sdk, STATE.network) });
  STATE.sdkReady = true;
  return STATE.readClient;
}

async function connectWallet(){
  const provider = window.ethereum;
  if(!provider) throw new Error('No EIP-1193 wallet found. Install MetaMask (or another browser wallet) to file claims.');
  let accounts;
  try {
    accounts = await provider.request({ method: 'eth_requestAccounts' });
  } catch(e){ throw new Error('Wallet connection rejected.'); }
  const account = accounts && accounts[0];
  if(!account) throw new Error('No account selected.');

  // Make sure the wallet is on the selected GenLayer network (add it if missing).
  const N = net();
  try {
    await provider.request({ method: 'wallet_switchEthereumChain', params:[{ chainId: N.chainId }] });
  } catch(sw){
    if(sw && (sw.code === 4902 || /unrecognized|not added|32603/i.test(String(sw.message||'')))){
      await provider.request({ method: 'wallet_addEthereumChain', params:[{
        chainId: N.chainId,
        chainName: N.chainName,
        rpcUrls: [N.rpcUrl],
        nativeCurrency: { name: 'GEN Token', symbol: 'GEN', decimals: 18 },
        blockExplorerUrls: [N.explorer],
      }]});
    } else {
      // Some wallets reject switch when already on the chain; continue.
    }
  }

  const sdk = await loadSDK();
  STATE.writeClient = sdk.createClient({
    chain: sdkChainFor(sdk, STATE.network),
    account,
    provider,
  });
  try { await STATE.writeClient.connect(N.sdkChain); } catch(_){ /* chain already switched */ }
  STATE.account = account;
  provider.on?.('accountsChanged', (accs)=>{ STATE.account = accs?.[0] || null; route(); });
  provider.on?.('chainChanged', ()=>{ /* no reload; reads are chain-bound by client */ });
  return account;
}

/* Send a write tx, wait for FINALIZED, and verify the execution result. */
async function sendWrite(functionName, args, valueWei=0n){
  if(!STATE.writeClient || !STATE.account) await connectWallet();
  const sdk = await loadSDK();
  const tx = await STATE.writeClient.writeContract({
    address: STATE.address,
    functionName,
    args,
    value: BigInt(valueWei),
  });
  const hash = tx?.transactionHash ?? tx?.hash ?? tx;
  const receipt = await STATE.writeClient.waitForTransactionReceipt({
    hash,
    status: sdk.TransactionStatus.FINALIZED,
    retries: 120,
    interval: 4000,
  });
  const resultName = receipt?.txExecutionResultName;
  if(resultName && resultName !== sdk.ExecutionResult.FINISHED_WITH_RETURN){
    throw new Error(`Transaction finalized but contract execution failed (${resultName}). State was not changed.`);
  }
  return { receipt, hash };
}

/* ============================================================
   DATA LOADING — every value comes from contract views
   ============================================================ */
function mapClaim(raw){
  return {
    id: num(raw.id),
    requester: raw.requester,
    subject: raw.subject,
    claim: raw.claim,
    evidence: Array.isArray(raw.evidence) ? raw.evidence : [],
    stakeWei: BigInt(num(raw.stake_wei)),
    status: raw.status,
    verdict: num(raw.verdict),
    verdictLabel: raw.verdict_label,
    confidence: num(raw.confidence),
    rationale: raw.rationale || '',
    citations: Array.isArray(raw.citations) ? raw.citations : [],
    appeals: num(raw.appeals),
    filed: raw.created_at || '',
    adjudicatedAt: raw.adjudicated_at || '',
  };
}
function mapTrust(raw){
  return {
    subject: raw.subject,
    totalVerdicts: num(raw.total_verdicts),
    verified: num(raw.verified),
    partial: num(raw.partial),
    contradicted: num(raw.contradicted),
    unverifiable: num(raw.unverifiable),
    score: num(raw.score),
    lastVerdict: num(raw.last_verdict),
    lastVerdictLabel: raw.last_verdict_label || 'NO_DATA',
    lastUpdated: raw.last_updated || '',
  };
}
function mapStats(raw){
  return {
    claimsFiled: num(raw.claims_filed),
    claimsAdjudicated: num(raw.claims_adjudicated),
    claimsContradicted: num(raw.claims_contradicted),
    treasuryWei: BigInt(num(raw.treasury_wei)),
    minStakeWei: BigInt(num(raw.min_stake_wei)),
    feeBps: num(raw.fee_bps),
  };
}

async function loadAll(){
  STATE.network = networkKey();
  STATE.address = contractAddress();
  STATE.readClient = null;  // rebuild client for the selected network
  if(!STATE.address){ STATE.cases=[]; STATE.stats=null; return; }
  await ensureReadClient();

  // stats first — gives us the authoritative filed count
  try { STATE.stats = mapStats(await readView('get_stats', [])); }
  catch(e){ STATE.stats = null; }

  // discover the docket: get_claim(1..N) until the first missing id.
  // next_id is monotonic and claims are never deleted, so this is a
  // deterministic view-only discovery strategy.
  const high = STATE.stats ? STATE.stats.claimsFiled : 0;
  const cases = [];
  const subjects = new Set();
  let id = 1;
  const cap = Math.max(high + 1, 1);
  while(id <= cap + 5){
    let raw;
    try { raw = await readView('get_claim', [id]); }
    catch(_) { break; }            // "claim not found" -> end of docket
    if(!raw || raw.subject == null) break;
    const c = mapClaim(raw);
    cases.push(c);
    if(c.subject) subjects.add(c.subject);
    id++;
  }
  STATE.cases = cases;
  STATE.subjects = subjects;
}

async function refresh(){ await loadAll(); }

async function getTrust(subject){
  try { return mapTrust(await readView('get_trust', [subject])); }
  catch(_){ return { subject, totalVerdicts:0, verified:0, partial:0, contradicted:0, unverifiable:0, score:50, lastVerdict:0, lastVerdictLabel:'NO_DATA', lastUpdated:'' }; }
}
async function getTrustBatch(subjects){
  if(!subjects.length) return [];
  try {
    const raw = await readView('get_trust_batch', [JSON.stringify(subjects)]);
    const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
    return (Array.isArray(arr)?arr:[]).map(mapTrust);
  } catch(_){ return []; }
}

/* ============================================================
   DESIGN HELPERS (icons, stamp, seal, formatting)
   ============================================================ */
function timeAgo(iso){
  if(!iso) return '—';
  const t = new Date(iso).getTime(); if(!Number.isFinite(t)) return '—';
  const diff = (Date.now()-t)/1000;
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.round(diff/60)+'m ago';
  if(diff < 86400) return Math.round(diff/3600)+'h ago';
  return Math.round(diff/86400)+'d ago';
}
function utc(iso){ if(!iso) return '—'; const d=new Date(iso); return Number.isFinite(d)? d.toISOString().slice(11,19)+' UTC' : '—'; }
function dateShort(iso){ if(!iso) return '—'; const d=new Date(iso); return Number.isFinite(d)? d.toISOString().slice(0,10) : '—'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function Stamp(verdictCode, {mini=false, landing=false}={}){
  const cls = `stamp ${mini?'mini':''} ${VERDICT_CLASS[verdictCode]||'verdict-0'} ${landing?'landing':''}`;
  return `<span class="${cls}">${esc(VERDICT_LABEL[verdictCode]||'NONE')}</span>`;
}
function sealBand(score){
  if(score===50) return {color:'var(--paper-dim)', label:'NO DATA'};
  if(score>=70) return {color:'var(--verdict-green)', label:'TRUSTED'};
  if(score>=40) return {color:'var(--verdict-amber)', label:'MIXED'};
  return {color:'var(--seal-red)', label:'FLAGGED'};
}
function seed(str){ let h=0; for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;} return h; }
function SealScore(key, score, size=96){
  const band = sealBand(score);
  const r = size/2 - 8, cx=size/2, cy=size/2, pts=14;
  let path=''; const rnd = seed(String(key)+score);
  for(let i=0;i<=pts;i++){
    const a=(i/pts)*Math.PI*2; const wob=((rnd>>(i%20))%5)-2;
    const rr=r+(score===50?0:wob*0.8);
    const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
    path+=(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' ';
  }
  const fs=size*0.30;
  return `<div class="seal-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <path d="${path}Z" fill="none" stroke="${band.color}" stroke-width="2.5"/>
      <circle cx="${cx}" cy="${cy}" r="${r-9}" fill="none" stroke="${band.color}" stroke-width="1" opacity=".5"/>
      <text x="${cx}" y="${cy+fs*0.33}" text-anchor="middle" fill="${band.color}" font-family="Fraunces" font-size="${fs}" font-weight="680">${score===50?'—':score}</text>
    </svg>
    <div class="seal-band-label" style="color:${band.color}">${band.label}</div>
  </div>`;
}

/* ============================================================
   RAIL / NAV / TICKER / BADGE
   ============================================================ */
const NAVS = [
  {href:'#/preflight', label:'Pre-flight'},
  {href:'#/docket', label:'Docket'},
  {href:'#/ledger', label:'Trust ledger'},
  {href:'#/protocol', label:'Protocol'},
];
function isActive(href){
  const h = location.hash || '#/preflight';
  if(href==='#/preflight') return h.startsWith('#/preflight') || h==='' || h==='#/';
  return h.startsWith(href);
}

function renderRail(){
  const s = STATE.stats;
  const addr = STATE.address;
  document.getElementById('rail').innerHTML = `
    <div class="brand">
      <div class="brand-mark">OATH<span>.</span></div>
      <div class="brand-tag">Every claim faces a jury</div>
    </div>
    <nav class="navlist">
      ${NAVS.map(n=>`<a class="navitem ${isActive(n.href)?'active':''}" href="${n.href}"><span class="dot"></span>${n.label}</a>`).join('')}
    </nav>
    <div class="rail-net-switch">
      ${Object.values(NETWORKS).map(n=>`<button class="net-btn ${STATE.network===n.key?'on':''}" data-net="${n.key}">${n.key==='studionet'?'STUDIO':'BRADBURY'}</button>`).join('')}
    </div>
    <div class="rail-addr">
      <button class="cfg-btn" id="cfgBtn">${addr ? 'CONTRACT '+shortAddr(addr) : 'CONFIGURE CONTRACT'}</button>
      <button class="cfg-btn wallet" id="walletBtn">${STATE.account ? 'WALLET '+shortAddr(STATE.account) : 'CONNECT WALLET'}</button>
    </div>
    <div class="rail-stats">
      <div class="rail-stat-row"><span class="k">Cases filed</span><span class="v">${s?s.claimsFiled:'—'}</span></div>
      <div class="rail-stat-row"><span class="k">Adjudicated</span><span class="v">${s?s.claimsAdjudicated:'—'}</span></div>
      <div class="rail-stat-row"><span class="k">Contradicted</span><span class="v" style="color:var(--seal-red)">${s?s.claimsContradicted:'—'}</span></div>
      <div class="rail-stat-row"><span class="k">Treasury</span><span class="v">${s?fmtGEN(s.treasuryWei):'—'}</span></div>
    </div>
    <div class="rail-seal">
      <div class="rail-seal-label">Network</div>
      <div class="rail-net">${net().label}<br><span style="color:var(--paper-dim)">chain ${parseInt(net().chainId,16)} · GEN</span></div>
    </div>
  `;
  document.getElementById('topbar').innerHTML = `
    <div class="brand-mark">OATH<span>.</span></div>
    <select onchange="location.hash=this.value">
      ${NAVS.map(n=>`<option value="${n.href}" ${isActive(n.href)?'selected':''}>${n.label}</option>`).join('')}
    </select>
  `;
  document.getElementById('footerContract').innerHTML = addr
    ? `<a href="${explorerAddr(addr)}" target="_blank" rel="noopener">CONTRACT ${shortAddr(addr)}</a>`
    : 'NO CONTRACT CONFIGURED';
  const cfgBtn=document.getElementById('cfgBtn'), wBtn=document.getElementById('walletBtn');
  if(cfgBtn) cfgBtn.onclick = promptContract;
  if(wBtn) wBtn.onclick = async ()=>{ try{ await connectWallet(); toast('Wallet connected: '+shortAddr(STATE.account)); renderRail(); }catch(e){ toast(e.message,'err'); } };
  document.querySelectorAll('.net-btn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.net; if(k===STATE.network) return;
    localStorage.setItem('oath_network', k);
    STATE.network=k; STATE.address=null; STATE.readClient=null; STATE.writeClient=null; STATE.account=null;
    toast('Switched to '+(NETWORKS[k].label)); route();
  });

  const badge = document.getElementById('netBadgeText');
  const pip = document.querySelector('#netBadge .pip');
  if(!addr){ badge.textContent='NO CONTRACT — CONFIGURE TO READ LIVE STATE'; pip.style.background='var(--verdict-amber)'; }
  else if(STATE.sdkError){ badge.textContent='RPC ERROR — '+net().label; pip.style.background='var(--seal-red)'; }
  else { badge.textContent=net().label+' · LIVE'; pip.style.background='var(--verdict-green)'; }
}

function renderTicker(){
  const items = STATE.cases
    .filter(c=>c.status!=='PENDING' && c.verdict>0)
    .sort((a,b)=> new Date(b.adjudicatedAt||b.filed) - new Date(a.adjudicatedAt||a.filed))
    .map(c=>`<span class="ticker-item">◈ <b style="color:${VERDICT_COLOR[c.verdict]}">${esc(VERDICT_SHORT[c.verdict])}</b> · ${esc(c.subject)} · #${String(c.id).padStart(4,'0')}</span>`).join('');
  const wrap = document.getElementById('ticker');
  wrap.innerHTML = items ? `<div class="ticker-track">${items}${items}</div>`
    : `<div class="ticker-track"><span class="ticker-item">◈ NO VERDICTS ON-CHAIN YET — FILE THE FIRST CASE</span></div>`;
}

/* ============================================================
   CONFIGURE CONTRACT PROMPT
   ============================================================ */
function promptContract(){
  const cur = STATE.address || '';
  const v = prompt('Paste your deployed OathRegistry address (0x…) on '+net().label+':', cur);
  if(v==null) return;
  const addr = v.trim();
  if(addr && !/^0x[0-9a-fA-F]{40}$/.test(addr)){ toast('That does not look like a 0x address.','err'); return; }
  if(addr){ setContractAddress(addr); toast('Contract set: '+shortAddr(addr)); }
  else { localStorage.removeItem('oath_contract'); STATE.address=null; STATE.cases=[]; STATE.stats=null; }
  route();
}

/* ============================================================
   TOAST / STATUS
   ============================================================ */
let toastTimer=null;
function toast(msg, kind='ok'){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.className = kind==='err' ? 'toast err' : 'toast';
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.opacity='0'; }, 5200);
}
function setBusy(el, msg){ if(el){ el.disabled=true; el.dataset.label=el.textContent; el.textContent=msg; } }
function clearBusy(el){ if(el){ el.disabled=false; if(el.dataset.label) el.textContent=el.dataset.label; } }

async function fileClaim(){
  const btn=document.getElementById('fileBtn');
  const msg=document.getElementById('fileMsg');
  const subject=document.getElementById('f-subject').value.trim();
  const claim=document.getElementById('f-claim').value.trim();
  const urls=[...document.querySelectorAll('#exRows input')].map(i=>i.value.trim()).filter(Boolean);
  msg.className='file-msg'; msg.textContent='';

  if(subject.length<3){ msg.className='file-msg err'; msg.textContent='Subject must be at least 3 characters.'; return; }
  if(claim.length<20){ msg.className='file-msg err'; msg.textContent='The claim must be at least 20 characters (the contract enforces this).'; return; }
  if(urls.length<1){ msg.className='file-msg err'; msg.textContent='Add at least one evidence URL the contract can fetch.'; return; }
  if(urls.length>5){ msg.className='file-msg err'; msg.textContent='At most 5 evidence URLs.'; return; }
  for(const u of urls){ if(!/^https?:\/\//.test(u)){ msg.className='file-msg err'; msg.textContent='Evidence URLs must start with http(s)://: '+u; return; } }

  const stakeWei = STATE.stats ? STATE.stats.minStakeWei : 10n*GEN;
  try{
    if(!STATE.account){ toast('Connect a wallet to file a claim.'); await connectWallet(); renderRail(); }
    setBusy(btn,'FILING… SIGN WALLET');
    renderPreflightBoard({stage:0});
    const { hash: fileHash } = await sendWrite('file_claim', [subject, claim, JSON.stringify(urls)], stakeWei);
    toast('file_claim finalized: '+shortAddr(fileHash));

    // discover the new case id from the chain (re-read stats + claims)
    await refresh();
    const created = STATE.cases.filter(c=>c.subject===subject).sort((a,b)=>b.id-a.id)[0];
    const caseId = created ? created.id : (STATE.stats?STATE.stats.claimsFiled:1);
    renderPreflightBoard({stage:1, caseId, stake:fmtGEN(stakeWei)});
    renderRail(); renderTicker();

    msg.className='file-msg ok';
    msg.innerHTML = `Case <b>#${String(caseId).padStart(4,'0')}</b> is on-chain as PENDING. The jury has not convened yet — `
      + `<a href="#/case/${caseId}" style="color:var(--gold);text-decoration:underline">open the case and RUN JURY →</a>`;
    clearBusy(btn);
    document.getElementById('filingForm').reset();
    document.getElementById('exRows').innerHTML=`<div class="exhibit-row"><span class="ex-label">EXHIBIT A</span><input class="field" placeholder="https://…"/></div>`;
  }catch(e){
    clearBusy(btn);
    msg.className='file-msg err';
    msg.textContent = friendlyErr(e);
    renderPreflightBoard({stage:0});
  }
}

function friendlyErr(e){
  const m = (e && (e.shortMessage || e.message || String(e))) || 'Transaction failed.';
  if(/stake too low/i.test(m)) return 'Stake too low — the wallet must send at least the minimum GEN stake.';
  if(/claim_text must be/i.test(m)) return 'The claim text must be 20–2000 characters.';
  if(/subject must be/i.test(m)) return 'The subject must be 3–256 characters.';
  if(/evidence/i.test(m)) return 'Evidence must be a JSON array of 1–5 http(s) URLs.';
  if(/user rejected|rejected the transaction/i.test(m)) return 'Transaction rejected in the wallet.';
  if(/insufficient|not enough funds/i.test(m)) return 'Insufficient GEN for stake + gas. Use the faucet.';
  if(/FINISHED_WITH_ERROR|execution failed/i.test(m)) return 'Contract execution reverted: '+m;
  return m;
}

function renderDocketBody(){
  let rows=STATE.cases.slice();
  if(docketFilter){
    const map={VERIFIED:1,PARTIAL:2,CONTRADICTED:3,UNVERIFIABLE:4};
    if(docketFilter==='APPEALING') rows=rows.filter(c=>c.status==='APPEALING');
    else if(docketFilter==='PENDING') rows=rows.filter(c=>c.status==='PENDING'||c.status==='ADJUDICATING');
    else rows=rows.filter(c=>c.verdict===map[docketFilter]);
  }
  if(docketSearch) rows=rows.filter(c=>c.subject.toLowerCase().includes(docketSearch.toLowerCase()));
  const key=docketSort.key, dir=docketSort.dir;
  rows.sort((a,b)=>{
    let av,bv;
    if(key==='id'){av=a.id;bv=b.id;}
    else if(key==='filed'){av=new Date(a.filed).getTime()||0;bv=new Date(b.filed).getTime()||0;}
    else if(key==='confidence'){av=a.confidence;bv=b.confidence;}
    else if(key==='stake'){av=Number(a.stakeWei);bv=Number(b.stakeWei);}
    else if(key==='verdict'){av=a.verdict;bv=b.verdict;}
    else {av=a[key==='type'?'status':key]||'';bv=b[key==='type'?'status':key]||'';}
    if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
  });
  const body=document.getElementById('docketBody');
  if(rows.length===0){ body.innerHTML=`<tr><td colspan="9"><div class="empty-state">${STATE.cases.length===0?'The docket is empty. File the first case.':'No cases match that filter.'}</div></td></tr>`; return; }
  body.innerHTML=rows.map(DocketRow).join('');
}

async function screenCase(id){
  const el=document.getElementById('content');
  if(!STATE.address){ el.innerHTML=configGate(); wireGate(); return; }
  el.innerHTML=`<div class="empty-state">Reading case #${String(id).padStart(4,'0')} from chain…</div>`;

  try { raw = await readView('get_claim', [Number(id)]); }

  const c = mapClaim(raw);
  const trust = await getTrust(c.subject);

  // appeal stake mirrors the contract: extra = stake * multiplier^(appeal_count+1)
  const multiplier = 2n;
  const nextAppealExtra = c.appeals < 2 ? c.stakeWei * (multiplier ** BigInt(c.appeals+1)) : 0n;
  const canAppeal = c.status==='VERDICTED';
  const canFinalize = (c.status==='VERDICTED' || c.status==='APPEALING');
  const canAdjudicate = (c.status==='PENDING' || c.status==='APPEALING');

  el.innerHTML = `
    <div class="folder">
      <div class="folder-tab">Case #${String(c.id).padStart(4,'0')}</div>
      <div class="file-header">
        <div>
          <h1 style="font-family:var(--serif);font-size:clamp(26px,3.4vw,38px);font-weight:560;margin:6px 0">${esc(c.subject)}</h1>
          <div class="pull-quote ${c.verdict===3?'seal-red':'gold'}">${esc(c.claim)}</div>
          <div class="meta-strip">
            <span>FILED ${utc(c.filed)}</span>
            <span>BY <a href="${explorerAddr(c.requester)}" target="_blank" rel="noopener" style="color:var(--verdict-blue)">${shortAddr(c.requester)}</a></span>
            <span>STAKE ${fmtGEN(c.stakeWei)}</span>
            <span>RECORD PUBLIC CLAIM</span>
            <span>APPEALS ${c.appeals}/2</span>
          </div>
        </div>
        <div class="sidecol">
          ${c.status==='PENDING' ? `<div style="font-family:var(--mono);font-size:11px;color:var(--paper-dim)">AWAITING JURY — STATUS ${esc(c.status)}</div>`
            : c.status==='ADJUDICATING' ? `<div style="font-family:var(--mono);font-size:11px;color:var(--gold)">JURY DELIBERATING…</div>`
            : Stamp(c.verdict)}
          ${c.confidence?`<div class="sc-row">CONFIDENCE <b>${c.confidence}%</b></div>`:''}
          <div class="sc-row">CONTRACT <a href="${explorerAddr(STATE.address)}" target="_blank" rel="noopener" style="color:var(--verdict-blue)"><b>${shortAddr(STATE.address)}</b></a></div>
          <div style="display:flex;align-items:center;gap:14px">
            ${SealScore(c.subject, trust.score, 76)}
            <div class="sc-row" style="line-height:1.7">SEAL SCORE<br>OF <b>${esc(c.subject)}</b><br><span style="color:var(--paper-dim)">from get_trust()</span></div>
          </div>
          ${canAdjudicate ? `<button class="action-btn" id="btnAdj">${c.status==='APPEALING'?'RE-RUN JURY (re-adjudicate)':'Run jury — adjudicate()'}</button>` : ''}
          ${canAppeal ? `<button class="action-btn" id="btnAppeal">Submit appeal — stake ${fmtGEN(nextAppealExtra)} (×${c.appeals===0?2:4})</button>` : ''}
          ${c.status==='APPEALING' ? `<button class="action-btn" disabled>APPEAL OPEN — RE-RUN JURY</button>` : ''}
          ${c.status==='FINAL' ? `<button class="action-btn" disabled>FINAL — RECORD LOCKED</button>`
            : canFinalize ? `<button class="action-btn" id="btnFinal">Finalize — lock verdict</button>` : ''}
          <div id="caseMsg" class="file-msg"></div>
        </div>
      </div>

      ${c.evidence.length ? `
      <div class="tabs" id="exTabs">
        ${c.evidence.map((u,i)=>`<button class="tab-btn ${i===0?'active':''}" data-i="${i}"><span class="dot" style="background:var(--verdict-blue)"></span>EXHIBIT ${String.fromCharCode(65+i)}</button>`).join('')}
      </div>
      <div id="exBody">${ExhibitPin(c.evidence[0], 0)}</div>
      ` : ''}

      ${c.status!=='PENDING' && c.status!=='ADJUDICATING' ? `
      <div class="transcript-head">Jury transcript — verdict from OathRegistry</div>
      <div class="transcript-body" id="transcriptBody"></div>
      <div class="citelist">${c.citations.length ? c.citations.map(u=>`<a class="cite-row" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('') : '<span style="color:var(--paper-dim)">No citations returned.</span>'}</div>
      ` : `<div class="transcript-head">Jury transcript</div><div class="transcript-body" style="color:var(--paper-dim)">The jury has not yet convened on this case. Call adjudicate() to fetch the evidence and run consensus.</div>`}

      ${c.appeals>0 ? `<div class="appeal-history">APPEAL HISTORY · ${c.appeals} appeal${c.appeals>1?'s':''} filed on-chain · status ${esc(c.status)}${c.adjudicatedAt?' · last adjudicated '+dateShort(c.adjudicatedAt):''}</div>` : ''}
    </div>
  `;

  if(c.evidence.length){
    document.querySelectorAll('#exTabs .tab-btn').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#exTabs .tab-btn').forEach(x=>x.classList.remove('active'));

    });
  }
  if(c.status!=='PENDING' && c.status!=='ADJUDICATING' && c.rationale) typewrite(document.getElementById('transcriptBody'), c.rationale);

  const msg=document.getElementById('caseMsg');
  const btnAdj=document.getElementById('btnAdj'), btnAppeal=document.getElementById('btnAppeal'), btnFinal=document.getElementById('btnFinal');
  if(btnAdj) btnAdj.onclick=()=>runWrite('adjudicate', [c.id], 0n, btnAdj, msg, 'Jury convening — the contract is fetching evidence and reaching consensus. This can take 30–90s…');
  if(btnAppeal) btnAppeal.onclick=()=>runWrite('appeal', [c.id], nextAppealExtra, btnAppeal, msg, 'Appeal submitted; status is now APPEALING. Re-run the jury to re-adjudicate.');
  if(btnFinal) btnFinal.onclick=()=>runWrite('finalize', [c.id], 0n, btnFinal, msg, 'Finalize submitted — the record will be locked.');
}

/* Evidence display: the contract does NOT persist HTTP status/content,
   so we label exhibits ON-CHAIN EVIDENCE and never fabricate a 200/404. */
function ExhibitPin(url, idx){
  return `<div class="exhibit-pin">
    <div class="ex-url">${esc(url)}</div>
    <div class="ex-status" style="color:var(--verdict-blue);border-color:rgba(78,124,168,.4)">on-chain evidence · fetched by the contract at adjudication</div>
    <div class="ex-preview" style="filter:none">The contract fetches this URL itself during adjudicate() (native web access). HTTP status and page content are not persisted in OathRegistry storage — the verdict’s rationale and citations reflect what the jury read.</div>
  </div>`;
}

async function runWrite(method, args, valueWei, btn, msgEl, okNote){
  try{
    if(!STATE.account){ toast('Connect a wallet first.'); await connectWallet(); renderRail(); }
    setBusy(btn,'SUBMITTING…');
    msgEl.className='file-msg'; msgEl.textContent='Waiting for wallet signature and GenLayer consensus…';
    const { hash } = await sendWrite(method, args, valueWei);
    msgEl.className='file-msg ok';
    msgEl.innerHTML = `${esc(okNote||'Done.')} <span style="color:var(--paper-dim)">tx ${shortAddr(hash)}. Re-reading state from contract views…</span>`;
    clearBusy(btn);
    await refresh();
    renderRail(); renderTicker();
    // re-render the current case from fresh chain state
    const m = location.hash.match(/#\/case\/(\d+)/);
    if(m) screenCase(Number(m[1])); else route();
  }catch(e){
    clearBusy(btn);
    msgEl.className='file-msg err';
    msgEl.textContent = friendlyErr(e);
  }
}

function typewrite(el, text){
  const reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
  if(reduced){ el.textContent=text; return; }
  let i=0; el.textContent='';
  const step=()=>{ if(i<=text.length){ el.textContent=text.slice(0,i); i++; setTimeout(step,12); } };
  step();
}

/* ============================================================
   S4 — TRUST LEDGER
   ============================================================ */
async function screenLedger(prefill){
  const el=document.getElementById('content');
  if(!STATE.address){ el.innerHTML=configGate(); wireGate(); return; }
  // build the "top subjects" table from the on-chain docket, scored via get_trust_batch
  const subjectList = [...STATE.subjects];
  const scores = await getTrustBatch(subjectList);
  const bySub = Object.fromEntries(scores.map(s=>[s.subject,s]));
  const counts = {};
  STATE.cases.forEach(c=>{ counts[c.subject]=(counts[c.subject]||0)+1; });
  const top = subjectList
    .map(s=>({ subject:s, trust:bySub[s]||{score:50,totalVerdicts:0,lastVerdictLabel:'NO_DATA'}, n:counts[s]||0 }))
    .sort((a,b)=> b.n - a.n || b.trust.totalVerdicts - a.trust.totalVerdicts);

  el.innerHTML = `
    <div class="eyebrow" style="text-align:center;display:block">Trust ledger</div>
    <h2 class="section-title" style="text-align:center">Scan any subject before you trust it.</h2>
    <div class="scan-bar">
      <span class="prefix">$ get_trust(</span><input id="ledgerInput" placeholder="app.defiplatform.xyz" value="${esc(prefill||'')}"/><span class="prefix">)</span>
    </div>
    <div id="ledgerResult"></div>
    <h3 style="font-family:var(--serif);font-size:19px;margin-top:44px">Subjects on the record</h3>
    <p class="section-sub">Scores are read live from get_trust_batch() — the same call any agent/wallet/marketplace makes.</p>
    <table class="subject-table">
      <thead><tr><th>Subject</th><th>Cases</th><th>Verdicts</th><th>Seal</th><th>Last verdict</th></tr></thead>
      <tbody>
        ${top.length ? top.map(r=>`<tr onclick="document.getElementById('ledgerInput').value='${esc(r.subject)}';renderLedgerResult('${esc(r.subject)}')">
          <td style="font-family:var(--serif);color:var(--paper)">${esc(r.subject)}</td>
          <td>${r.n}</td><td>${r.trust.totalVerdicts}</td>
          <td style="color:${sealBand(r.trust.score).color}">${r.trust.score===50&&r.trust.totalVerdicts===0?'—':r.trust.score}</td>
          <td>${esc(r.trust.lastVerdictLabel)}</td></tr>`).join('')
          : '<tr><td colspan="5" style="color:var(--paper-dim)">No subjects on-chain yet.</td></tr>'}
      </tbody>
    </table>
  `;
  const input=document.getElementById('ledgerInput');
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') renderLedgerResult(input.value.trim()); });
  if(prefill) renderLedgerResult(prefill);
}

window.renderLedgerResult = async function(subject){
  const box=document.getElementById('ledgerResult');
  if(!subject){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="folder" style="margin-top:26px;text-align:center"><div class="empty-state" style="padding:30px">Reading get_trust("${esc(subject)}")…</div></div>`;
  const sc = await getTrust(subject);
  const hist = STATE.cases.filter(c=>c.subject===subject).sort((a,b)=> new Date(b.filed)-new Date(a.filed));
  if(sc.totalVerdicts===0){
    box.innerHTML=`<div class="folder" style="margin-top:26px;text-align:center">
      ${SealScore(subject,50,110)}
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--paper-dim);margin-top:14px">
        NO VERDICTS ON RECORD.<br>50 = NEUTRAL. TRUST NOTHING UNVERIFIED.
      </div>
    </div>`;
    return;
  }
  box.innerHTML=`
    <div class="folder">
      <div class="folder-tab">${esc(subject)}</div>
      <div class="ledger-result">
        ${SealScore(subject, sc.score, 130)}
        <div>
          <div class="runrate-row"><span class="lbl">VERIFIED</span><span style="color:var(--verdict-green)">${sc.verified}</span></div>
          <div class="runrate-row"><span class="lbl">PARTIAL</span><span style="color:var(--verdict-amber)">${sc.partial}</span></div>
          <div class="runrate-row"><span class="lbl">CONTRADICTED</span><span style="color:var(--seal-red)">${sc.contradicted}</span></div>
          <div class="runrate-row"><span class="lbl">UNVERIFIABLE</span><span style="color:var(--verdict-blue)">${sc.unverifiable}</span></div>
          <div class="weighted-line">SCORE ${sc.score}/100 · WEIGHTED — VERIFIED 1.0 · PARTIAL 0.5 · UNVERIFIABLE 0.25 · CONTRADICTED 0.0</div>
        </div>
      </div>
      <h4 style="font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--paper-dim);margin-top:26px">History (${hist.length} case${hist.length===1?'':'s'} on file)</h4>
      ${hist.length ? `<table class="docket" style="margin-top:8px"><tbody>
        ${hist.map(c=>`<tr onclick="location.hash='#/case/${c.id}'">
          <td data-label="#"><span class="case-id">#${String(c.id).padStart(4,'0')}</span></td>
          <td data-label="Record" style="text-transform:uppercase;font-size:10.5px;color:var(--paper-dim)">Public claim</td>
          <td data-label="Verdict">${c.verdict?Stamp(c.verdict,{mini:true}):'—'}</td>
          <td data-label="When">${timeAgo(c.filed)}</td>
        </tr>`).join('')}
      </tbody></table>` : '<div class="empty-state" style="padding:20px">No cases for this subject in the discovered docket.</div>'}
    </div>`;
};

/* ============================================================
   S5 — PROTOCOL
   ============================================================ */
function screenProtocol(){
  const el=document.getElementById('content');
  el.innerHTML = `
    <div class="eyebrow">Protocol</div>
    <h2 class="section-title" style="margin-top:6px">How a claim becomes a record</h2>
    <div class="pillar-grid">
      <div class="folder pillar"><div class="folder-tab">Exhibit 1</div><h3>The fetch</h3>
        <p>The contract reaches out to the evidence URLs itself, natively, at adjudication time. You cannot doctor what the jury sees — it reads the live page, not a screenshot you submitted.</p></div>
      <div class="folder pillar"><div class="folder-tab">Exhibit 2</div><h3>The jury</h3>
        <p>A leader model drafts a verdict; validator models independently check it against the same evidence. Diverse model families, judgment rather than keyword matching, resolved by the Equivalence Principle.</p></div>
      <div class="folder pillar"><div class="folder-tab">Exhibit 3</div><h3>The record</h3>
        <p>Stake is posted, the verdict is written on-chain, and either party may appeal at ×2 stake, then ×4. The window closes after 7 days; after that, the record is final.</p></div>
    </div>

    <h3 style="font-family:var(--serif);font-size:20px;margin-top:44px">How a verdict is reached</h3>
    <div class="decision-tree">${decisionTreeSVG()}</div>

    <h3 style="font-family:var(--serif);font-size:20px;margin-top:44px">Verdict taxonomy</h3>
    <table class="tax-table">
      <thead><tr><th>Verdict</th><th>Meaning</th><th>Stake consequence</th></tr></thead>
      <tbody>
        <tr><td style="color:var(--verdict-green)">VERIFIED</td><td>The evidence held up.</td><td>Stake refunded, minus fee.</td></tr>
        <tr><td style="color:var(--verdict-amber)">PARTIALLY VERIFIED</td><td>Half the story checks out.</td><td>Stake refunded, minus fee.</td></tr>
        <tr><td style="color:var(--seal-red)">CONTRADICTED</td><td>The evidence says otherwise.</td><td>Stake forfeited to treasury.</td></tr>
        <tr><td style="color:var(--verdict-blue)">UNVERIFIABLE</td><td>The links went nowhere.</td><td>Stake refunded, minus fee.</td></tr>
      </tbody>
    </table>

    <h3 style="font-family:var(--serif);font-size:20px;margin-top:44px">The on-chain API</h3>
    <table class="tax-table">
      <thead><tr><th>Method</th><th>Kind</th><th>Purpose</th></tr></thead>
      <tbody>
        <tr><td>file_claim(subject, claim_text, evidence_json)</td><td>write · payable</td><td>File a claim, stake the minimum GEN.</td></tr>
        <tr><td>adjudicate(claim_id)</td><td>write</td><td>Fetch evidence, run the LLM jury, settle the stake.</td></tr>
        <tr><td>appeal(claim_id)</td><td>write · payable</td><td>Re-jury at ×2, then ×4 stake, inside the 7-day window.</td></tr>
        <tr><td>finalize(claim_id)</td><td>write</td><td>Lock the verdict after the appeal window.</td></tr>
        <tr><td>get_claim / get_verdict / get_trust / get_trust_batch / get_stats</td><td>view</td><td>Everything this app displays.</td></tr>
      </tbody>
    </table>

    <h3 style="font-family:var(--serif);font-size:20px;margin-top:44px">Questions on the record</h3>
    <div id="faq"></div>
  `;
  const faqs=[
    ['What counts as evidence?','Any URL the contract can reach and read at adjudication time — registry pages, reports, on-chain explorers, dashboards. If the jury cannot fetch it, it cannot verify it.'],
    ['Who pays?','The filer stakes GEN when filing. Stake is refunded (minus the protocol fee) unless the claim is CONTRADICTED, in which case it moves to the treasury.'],
    ['Can verdicts be appealed?','Yes, twice. The first appeal costs ×2 the original stake, the second ×4. Each appeal triggers re-adjudication by a fresh jury within the 7-day window.'],
    ['What is the seal?','A subject’s trust score, 0–100, computed on-chain from the weighted history of its verdicts. 50 means no verdicts exist yet — not a middling record.'],
    ['Where does this app get its data?','Every case, verdict, score and counter is read from OathRegistry view calls over GenLayerJS (Studio network by default; Bradbury selectable). The app holds no local records and simulates nothing.'],

  document.getElementById('faq').innerHTML=faqs.map((f,i)=>`
    <div class="faq-item" data-i="${i}">
      <button class="faq-q">${esc(f[0])}</button>
      <div class="faq-a"><p>${esc(f[1])}</p></div>

  document.querySelectorAll('.faq-item').forEach(item=>{ item.querySelector('.faq-q').onclick=()=>item.classList.toggle('open'); });

/* ============================================================
   ROUTER
   ============================================================ */
let routeToken=0;
async function route(){
  const token=++routeToken;
  renderRail();
  window.scrollTo(0,0);
  const h = location.hash || '#/preflight';

  // resolve the configured contract address (?contract= / localStorage) on every
  // navigation so configuring it (or opening a ?contract= link) takes effect at once.
  STATE.address = contractAddress();

  // ensure live data before rendering data screens
  if(STATE.address){
    const content=document.getElementById('content');
    if(content) content.innerHTML=`<div class="empty-state">Reading OathRegistry on ${net().label}…</div>`;
    try { await refresh(); }
    catch(e){ STATE.sdkError = (e&&e.message)||String(e); }
    if(token!==routeToken) return; // a newer route superseded this render
  } else {
    STATE.sdkError=null;
  }
  renderRail(); renderTicker();

  if(h.startsWith('#/case/')){
    const id=parseInt(h.split('/')[2]);
    await screenCase(id);
  } else if(h.startsWith('#/docket')){
    await screenDocket();
  } else if(h.startsWith('#/ledger')){
    const parts=h.split('/');
    await screenLedger(parts[2]?decodeURIComponent(parts[2]):null);
  } else if(h.startsWith('#/protocol')){
    screenProtocol();
  } else {
    screenPreflight();
  }
}
window.addEventListener('hashchange', route);
route();
</script>
